spring:
  application:
    name: sistema-vendas
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sistema_vendas}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Fotos de produto: 5 MB por arquivo (mesmo limite de FotoProduto), com folga no corpo da requisição.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

seguranca:
  jwt:
    segredo: ${JWT_SEGREDO}
    expiracaoMinutos: ${JWT_EXPIRACAO_MINUTOS:60}

pagamento:
  mercadopago:
    # Vazio = integração desligada (ProvedorPagamento só falha quando algo tenta cobrar de verdade).
    token-acesso: ${MERCADOPAGO_ACCESS_TOKEN:}
    # ID da maquininha Point vinculada à conta (lista em GET /point/integration-api/devices). Vazio = sem maquininha integrada.
    point-dispositivo: ${MERCADOPAGO_POINT_DISPOSITIVO:}
    segredo-webhook: ${MERCADOPAGO_WEBHOOK_SEGREDO:}

whatsapp:
  wapi:
    url-base: ${WAPI_URL_BASE:https://api.w-api.app}
    instance-id: ${WAPI_INSTANCE_ID:}
    token: ${WAPI_TOKEN:}
    webhook-token: ${WAPI_WEBHOOK_TOKEN:}

armazenamento:
  # Vazio = sem MinIO de pé; MinioArmazenamentoObjetos é não-fatal ao iniciar (ver a classe).
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: anexos-whatsapp

fiscal:
  ambiente: ${FISCAL_AMBIENTE:HOMOLOGACAO}
  certificado-a1-caminho: ${FISCAL_CERTIFICADO_A1_CAMINHO:}
  regime-tributario: ${FISCAL_REGIME_TRIBUTARIO:}
  provedor-nfse-token: ${FOCUS_NFE_TOKEN:}

# Primeiro acesso irrestrito (dono/programador). Criado na subida só se ainda não existir.
acesso-inicial:
  nome: ${ACESSO_INICIAL_NOME:Acesso inicial}
  email: ${ACESSO_INICIAL_EMAIL:}
  senha: ${ACESSO_INICIAL_SENHA:}

assistente:
  # Vazio = nenhum número reconhecido como o dono (o assistente por WhatsApp fica sem uso até configurar).
  telefone-dono: ${DONO_WHATSAPP_TELEFONE:}
  # Número interno, separado do de clientes (D17): outra instância da W-API, outro webhook.
  whatsapp:
    instance-id: ${WAPI_ASSISTENTE_INSTANCE_ID:}
    token: ${WAPI_ASSISTENTE_TOKEN:}
    webhook-token: ${WAPI_ASSISTENTE_WEBHOOK_TOKEN:}
  claude:
    chave-api: ${CLAUDE_API_KEY:}
    modelo: ${CLAUDE_MODELO:claude-haiku-4-5-20251001}

# Bot de atendimento ao cliente: chave SEPARADA da do assistente do gestor (isolamento contra
# vazamento por engenharia de prompt — decisão da análise inicial).
atendimento:
  claude:
    chave-api: ${CLAUDE_API_KEY_ATENDIMENTO:}
    modelo: ${CLAUDE_MODELO_ATENDIMENTO:claude-haiku-4-5-20251001}

# Origens externas liberadas por CORS (ver SecurityConfig) — ex.: o frontend no Netlify quando o
# backend está em outro domínio (Render). Vazio = CORS fechado (ok para o proxy nginx local, que é
# mesma origem).
cors:
  origens-permitidas: ${CORS_ORIGENS_PERMITIDAS:}

server:
  # Hosts de deploy (ex.: Render) escolhem a porta e a publicam em $PORT; localmente/Docker Compose
  # ninguém define essa variável, então cai no 8080 de sempre.
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
