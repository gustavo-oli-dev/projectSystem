server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # O frontend chama a API por caminho relativo (/api/...) — este proxy é o que liga isso
    # ao backend dentro da rede do Compose. Sem ele, toda chamada de API cai em 404 do nginx.
    location /api/ {
        # Padrão do nginx é 1 MB; fotos de produto vão até 5 MB (o backend valida o limite real).
        client_max_body_size 6m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
